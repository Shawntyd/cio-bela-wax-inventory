<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<title>Waxing Lounge Inventory — Cio Bela Salons</title>
<style>
  html { color-scheme: light only; }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,500;1,600&family=Jost:wght@400;500;600&display=swap');

  :root {
    --cream: #F5F0E8;
    --bark: #2C2016;
    --gold: #B8935A;
    --gold-light: #D4B896;
    --charcoal: #1A1410;
    --error: #B84A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Jost', sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 100px; }
  .hero-screen {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
  }
  .hero {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    line-height: 0;
  }
  .hero-img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
  .hero-fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(21,15,10,0) 0%,
      rgba(21,15,10,0) 70%,
      rgba(21,15,10,0.5) 82%,
      rgba(21,15,10,0.9) 92%,
      #150F0A 100%);
  }
  .hero-panel {
    background: #150F0A;
    text-align: center;
    padding: 30px 20px 26px;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: normal;
    font-weight: 300;
    font-size: 34px;
    letter-spacing: 0.05em;
    color: var(--cream);
    line-height: 1.15;
  }
  .hero-eyebrow {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-light);
    font-weight: 500;
    margin-bottom: 22px;
  }
  .toggle {
    display: flex; gap: 4px; background: rgba(245,240,232,0.14);
    border: 1px solid rgba(245,240,232,0.25);
    padding: 4px; border-radius: 10px; max-width: 640px; margin: 0 auto;
    backdrop-filter: blur(2px);
  }
  .toggle button {
    flex: 1; padding: 9px 0; border-radius: 8px; border: none;
    font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.02em; cursor: pointer; background: transparent; color: var(--cream);
  }
  .toggle button.active { background: var(--gold); color: var(--charcoal); }
  .title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 34px;
    color: var(--bark);
    line-height: 1.1;
  }
  .rule { height: 2px; width: 56px; background: var(--gold); margin: 10px 0 12px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gold); font-weight: 500;
  }
  .status-line { font-size: 13px; color: var(--bark); opacity: 0.7; margin-bottom: 18px; }
  .category { margin-bottom: 22px; }
  .cat-label {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: 10px;
  }
  .item-row {
    display: flex; align-items: center; gap: 14px; padding: 11px 4px;
    border-bottom: 1px solid rgba(44,32,22,0.08); cursor: pointer;
  }
  .item-name { font-size: 15px; }
  .item-name.checked { opacity: 0.6; text-decoration: line-through; }
  .seal {
    width: 26px; height: 26px; border-radius: 9999px; border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    cursor: pointer; background: transparent; transition: all 150ms ease;
  }
  .seal.checked {
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold));
    box-shadow: 0 1px 3px rgba(44,32,22,0.35);
  }
  .seal.small { width: 20px; height: 20px; }
  .seal svg { display: none; }
  .seal.checked svg { display: block; }

  .empty-box {
    padding: 40px 20px; text-align: center;
    border: 1px dashed var(--gold-light); border-radius: 12px;
  }
  .empty-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: var(--bark); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; opacity: 0.65; }

  .actions { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--gold); background: var(--gold); color: var(--charcoal);
    font-size: 12.5px; font-weight: 500; cursor: pointer; font-family: 'Jost', sans-serif;
  }
  .btn.muted { background: transparent; color: var(--bark); }
  .btn:disabled { border-color: rgba(44,32,22,0.15); background: transparent; color: rgba(44,32,22,0.35); cursor: not-allowed; }
  .btn-sm { padding: 5px 10px; border-radius: 6px; font-size: 12px; }

  .note { font-size: 11px; opacity: 0.55; margin-bottom: 20px; line-height: 1.5; }

  .owner-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: white; border: 1px solid rgba(44,32,22,0.1); border-radius: 10px; margin-bottom: 10px;
  }
  .owner-item .name { font-size: 14px; font-weight: 500; }
  .owner-item input[type="text"] {
    margin-top: 4px; width: 100%; font-size: 12px; border: none;
    border-bottom: 1px solid var(--gold-light); outline: none; padding: 3px 0;
    background: transparent; font-family: 'Jost', sans-serif;
  }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .step-btn {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--gold-light);
    background: transparent; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--bark);
  }
  .qty { font-size: 13px; min-width: 16px; text-align: center; }

  .lock-box { padding: 40px 20px; text-align: center; border: 1px dashed var(--gold-light); border-radius: 12px; }
  .lock-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: var(--bark); margin-bottom: 14px; }
  .lock-input {
    font-size: 18px; letter-spacing: 0.3em; text-align: center; padding: 10px 14px;
    border-radius: 8px; border: 1px solid var(--gold-light); outline: none; width: 140px;
    font-family: 'Jost', sans-serif; background: white;
  }
  .lock-input.error { border-color: var(--error); }
  .lock-error { font-size: 12px; color: var(--error); margin-top: 10px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bark); color: var(--cream); padding: 10px 18px; border-radius: 8px;
    font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: none;
  }
  .hidden { display: none !important; }
  .total-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bark); color: var(--cream);
    padding: 12px 20px 10px; display: flex; flex-direction: column; gap: 2px;
    font-family: 'Jost', sans-serif; box-shadow: 0 -4px 14px rgba(0,0,0,0.2);
    z-index: 10;
  }
  .total-bar .row { display: flex; justify-content: space-between; align-items: center; }
  .total-bar .label { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.75; }
  .total-bar .amount { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; font-weight: 600; color: var(--gold-light); }
  .total-bar .disclaimer { font-size: 10px; opacity: 0.55; text-align: right; font-style: italic; }
</style>
</head>
<body>

<div class="hero-screen">
  <div class="hero">
    <img class="hero-img" src="assets/hero.jpg" alt="Waxing service in progress" />
    <div class="hero-fade"></div>
  </div>
  <div class="hero-panel">
    <div class="hero-title">Waxing Lounge Inventory</div>
    <div class="hero-eyebrow">Cio Bela Salons · For Internal Use Only</div>
    <div class="toggle">
      <button id="tab-team" class="active">Team Checklist</button>
      <button id="tab-owner">Owner Dashboard</button>
      <button id="tab-history">Order History</button>
      <button id="tab-recipes">Recipes</button>
      <button id="tab-reports">Reports</button>
    </div>
  </div>
</div>

<div class="wrap">

  <div id="loading" class="status-line">Loading…</div>

  <div id="team-view"></div>
  <div id="owner-lock" class="hidden">
    <div class="lock-box">
      <div class="lock-title">Owner access only</div>
      <input class="lock-input" id="passcode-input" type="password" inputmode="numeric" placeholder="Passcode" />
      <div style="margin-top:14px;"><button class="btn" id="unlock-btn">Unlock</button></div>
      <div class="lock-error hidden" id="passcode-error">That's not the right passcode.</div>
    </div>
  </div>
  <div id="owner-view" class="hidden"></div>
  <div id="history-view" class="hidden"></div>
  <div id="recipes-view" class="hidden"></div>
  <div id="reports-view" class="hidden"></div>
</div>

<div class="toast" id="toast"></div>
<div class="total-bar hidden" id="total-bar">
  <div class="row">
    <span class="label">Estimated total</span>
    <span class="amount" id="total-amount">$0.00</span>
  </div>
  <div class="disclaimer" id="total-disclaimer">Based on your last saved price — actual Amazon price may vary at checkout</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc, getDoc,
    collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBGRiDz7_PvTNvz1ItFo3CcApVhe5TCI5g",
    authDomain: "cio-bela-wax-inventory.firebaseapp.com",
    projectId: "cio-bela-wax-inventory",
    storageBucket: "cio-bela-wax-inventory.firebasestorage.app",
    messagingSenderId: "279708252494",
    appId: "1:279708252494:web:e509ead05f03dfd526461f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const stateDocRef = doc(db, "inventory", "state");
  const ordersColRef = collection(db, "orders");
  const recipesDocRef = doc(db, "recipes", "config");
  const serviceLogColRef = collection(db, "service-log");
  const SPECIALISTS = [
    { id: "zoey", name: "Zoey" },
    { id: "mia", name: "Mia" },
  ];

  // Researched default consumption per service (editable — these are starting estimates, not gospel)
  const SERVICES = [
    { id: "brow-wax", name: "Brow Waxing & Shaping", defaults: { hardWax: 3.5, spatSmall: 1, gloves: 1 } },
    { id: "upper-lip-wax", name: "Upper Lip Wax", defaults: { hardWax: 2.5, spatSmall: 1, gloves: 1 } },
    { id: "chin-wax", name: "Chin Wax", defaults: { hardWax: 3, spatSmall: 1, gloves: 1 } },
    { id: "full-face-wax", name: "Full Face Wax", defaults: { hardWax: 15, spatSmall: 3, gloves: 1 } },
    { id: "nose-ear-wax", name: "Nose & Ear Wax", defaults: { hardWax: 10, spatSmall: 1, gloves: 1 } },
    { id: "underarm-wax", name: "Underarm Wax", defaults: { hardWax: 6.5, spatSmall: 1, gloves: 1 } },
    { id: "half-arm-wax", name: "Half Arm Wax", defaults: { hardWax: 12.5, spatMedium: 2, gloves: 1 } },
    { id: "full-arm-wax", name: "Full Arm Wax", defaults: { hardWax: 17.5, spatMedium: 4, gloves: 1 } },
    { id: "stomach-wax", name: "Stomach / Abdomen Wax", defaults: { hardWax: 15, spatMedium: 2, gloves: 1 } },
    { id: "back-wax", name: "Back Wax", defaults: { hardWax: 50, spatLarge: 7, gloves: 1 } },
    { id: "chest-wax", name: "Chest Wax", defaults: { hardWax: 40, spatLarge: 5, gloves: 1 } },
    { id: "lower-leg-wax", name: "Lower Leg Wax", defaults: { hardWax: 25, spatMedium: 3, gloves: 1 } },
    { id: "upper-leg-wax", name: "Upper Leg Wax", defaults: { hardWax: 30, spatMedium: 3, gloves: 1 } },
    { id: "full-leg-wax", name: "Full Leg Wax", defaults: { hardWax: 50, spatLarge: 7, gloves: 1 } },
    { id: "bikini-line-wax", name: "Bikini Line Wax", defaults: { hardWax: 12.5, spatSmall: 2, gloves: 1 } },
    { id: "full-bikini-wax", name: "Full Bikini Wax", defaults: { hardWax: 17.5, spatSmall: 3, gloves: 1 } },
    { id: "brazilian-wax", name: "Brazilian Wax", defaults: { hardWax: 90, spatSmall: 4, gloves: 1 } },
    { id: "mens-grooming-wax", name: "Men's Grooming Wax", defaults: { hardWax: 65, spatLarge: 6, gloves: 1 } },
    { id: "ingrown-treatment", name: "Ingrown Hair Treatment", defaults: { gloves: 1 } },
    { id: "post-wax-soothing", name: "Post-Wax Soothing Treatment", defaults: { gloves: 1 } },
    { id: "exfoliation-scrub", name: "Exfoliation Scrub", defaults: { gloves: 1 } },
    { id: "moisturizing-treatment", name: "Moisturizing Treatment", defaults: { gloves: 1 } },
    { id: "skin-calming-mask", name: "Skin Calming Mask", defaults: { gloves: 1 } },
  ];
  const RECIPE_FIELDS = [
    { key: "hardWax", label: "Hard wax (g)" },
    { key: "softWax", label: "Soft wax (g)" },
    { key: "stripsSmall", label: "Strips — small" },
    { key: "stripsLarge", label: "Strips — large" },
    { key: "spatSmall", label: "Spatulas — small" },
    { key: "spatMedium", label: "Spatulas — medium" },
    { key: "spatLarge", label: "Spatulas — large" },
    { key: "gloves", label: "Gloves (pairs)" },
  ];
  let recipes = {};

  const OWNER_PASSCODE = "4834";
  const SKIP_PASSCODE = true; // TEMPORARY — set back to false to re-enable the passcode gate
  const ASIN_RE = /^[A-Z0-9]{10}$/i;

  const CATEGORIES = [
    { id: "essentials", label: "Waxing & Application Essentials", items: [
      { id: "hard-wax", name: "Hard wax" },
      { id: "soft-wax", name: "Soft wax" },
      { id: "wax-stirs", name: "Wax stirs" },
      { id: "wax-strips-small", name: "Waxing strips (small)" },
      { id: "wax-strips-large", name: "Waxing strips (large)" },
      { id: "wood-spatulas-small", name: "Wooden spatulas (small)" },
      { id: "wood-spatulas-medium", name: "Wooden spatulas (medium)" },
      { id: "wood-spatulas-large", name: "Wooden spatulas (large)" },
    ]},
    { id: "care", label: "Pre & Post-Care Solutions", items: [
      { id: "pre-cleanse", name: "Pre cleanse" },
      { id: "pre-wax-oil", name: "Pre wax oil" },
      { id: "baby-powder", name: "Baby powder" },
      { id: "post-wax-spray", name: "Post wax — hypochlorous spray" },
      { id: "calming-cream", name: "Calming cream" },
      { id: "witch-hazel", name: "Witch hazel" },
      { id: "wax-remover", name: "Wax remover" },
    ]},
    { id: "sanitation", label: "Sanitation & Safety Protocol", items: [
      { id: "epa-disinfectant", name: "EPA-registered disinfectant" },
      { id: "barbicide", name: "Barbicide" },
      { id: "hand-sanitizer", name: "Hand sanitizer" },
      { id: "nitrile-gloves", name: "Nitrile gloves" },
    ]},
    { id: "tools", label: "Professional Tools", items: [
      { id: "tweezers", name: "Tweezers" },
      { id: "brow-scissors", name: "Brow scissors" },
      { id: "handheld-mirror", name: "Handheld mirror" },
      { id: "handheld-fan", name: "Handheld fan" },
      { id: "mapping-thread", name: "Mapping thread" },
    ]},
    { id: "disposables", label: "Disposables & Linens", items: [
      { id: "bed-paper", name: "Bed paper" },
      { id: "cotton-rounds", name: "Cotton rounds" },
      { id: "cotton-balls", name: "Cotton balls" },
    ]},
  ];
  const ALL_ITEMS = CATEGORIES.flatMap(c => c.items.map(i => ({ ...i, category: c.label })));

  function defaultState() {
    const s = {};
    ALL_ITEMS.forEach(i => { s[i.id] = { checked: false, qty: 1, link: "", price: 0 }; });
    return s;
  }

  let state = defaultState();
  let view = "team";
  let hasNavigated = false;
  let unlocked = SKIP_PASSCODE;
  let suppressNextRenderConflict = false;

  const teamViewEl = document.getElementById("team-view");
  const ownerViewEl = document.getElementById("owner-view");
  const ownerLockEl = document.getElementById("owner-lock");
  const loadingEl = document.getElementById("loading");
  const toastEl = document.getElementById("toast");

  function flashToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    setTimeout(() => { toastEl.style.display = "none"; }, 2200);
  }

  async function commit(next) {
    state = next;
    try {
      await setDoc(stateDocRef, next, { merge: true });
    } catch (e) {
      console.error("Save failed", e);
      flashToast("Couldn't save — check your connection");
    }
  }

  function toggleItem(id) {
    hasNavigated = true;
    const next = { ...state, [id]: { ...state[id], checked: !state[id].checked } };
    commit(next);
  }

  function updateQty(id, delta) {
    const cur = state[id].qty || 1;
    const qty = Math.max(1, cur + delta);
    commit({ ...state, [id]: { ...state[id], qty } });
    renderOwner();
  }

  function updateLink(id, link) {
    state = { ...state, [id]: { ...state[id], link } };
    setDoc(stateDocRef, state, { merge: true }).catch(e => console.error(e));
  }

  function updatePrice(id, priceStr) {
    const price = Math.max(0, parseFloat(priceStr) || 0);
    state = { ...state, [id]: { ...state[id], price } };
    setDoc(stateDocRef, state, { merge: true }).catch(e => console.error(e));
    renderTeam();
    if (view === "owner") renderOwner();
  }

  function sealHtml(checked, size = 26) {
    return `<div class="seal ${checked ? 'checked' : ''}" style="width:${size}px;height:${size}px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1410" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>`;
  }

  function renderTeam() {
    const flagged = ALL_ITEMS.filter(i => state[i.id]?.checked);
    let html = `<div class="status-line">${
      flagged.length === 0
        ? "Everything's stocked. Check an item the moment it's running low."
        : flagged.length + " item" + (flagged.length === 1 ? "" : "s") + " flagged for reorder."
    }</div>`;

    CATEGORIES.forEach(cat => {
      html += `<div class="category"><div class="cat-label">${cat.label}</div>`;
      cat.items.forEach(item => {
        const checked = !!state[item.id]?.checked;
        html += `<div class="item-row" data-id="${item.id}">
          ${sealHtml(checked)}
          <span class="item-name ${checked ? 'checked' : ''}">${item.name}</span>
        </div>`;
      });
      html += `</div>`;
    });
    teamViewEl.innerHTML = html;
    teamViewEl.querySelectorAll(".item-row").forEach(row => {
      row.addEventListener("click", () => toggleItem(row.dataset.id));
    });
    updateTotalBar(flagged);
  }

  const TAX_RATE = 0.0825;

  function updateTotalBar(flagged) {
    const totalBar = document.getElementById("total-bar");
    const totalAmount = document.getElementById("total-amount");
    const disclaimerEl = document.getElementById("total-disclaimer");
    if (flagged.length === 0 || !hasNavigated) {
      totalBar.classList.add("hidden");
      return;
    }
    const subtotal = flagged.reduce((sum, i) => sum + (state[i.id].price || 0) * (state[i.id].qty || 1), 0);
    const tax = subtotal * TAX_RATE;
    const total = subtotal + tax;
    totalAmount.textContent = "$" + total.toFixed(2);
    disclaimerEl.textContent = `Includes est. 8.25% tax ($${tax.toFixed(2)} on $${subtotal.toFixed(2)} subtotal) — actual Amazon price may vary at checkout`;
    totalBar.classList.remove("hidden");
  }

  function renderOwner() {
    const flagged = ALL_ITEMS.filter(i => state[i.id]?.checked);
    if (flagged.length === 0) {
      ownerViewEl.innerHTML = `<div class="empty-box">
        <div class="empty-title">Nothing flagged yet</div>
        <div class="empty-sub">Once the team checks items off, they'll show up here to order.</div>
      </div>`;
      return;
    }

    let html = `<div class="actions">
      <button class="btn" id="copy-list-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg> Copy order list</button>
      <span id="clear-controls"><button class="btn muted" id="mark-ordered-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"></path><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"></path></svg> Mark ordered</button></span>
      <span id="clear-all-controls"><button class="btn muted" id="clear-all-btn" style="border-color:var(--error);color:var(--error);">Clear all</button></span>
    </div>
    <div class="note">For Amazon items with an ASIN saved, tap "Open" to jump straight to that exact product page and tap Add to Cart there. For anything else, use "Copy order list" and paste it into that site's search.</div>`;

    flagged.forEach(item => {
      const link = state[item.id]?.link || "";
      const qty = state[item.id]?.qty || 1;
      const price = state[item.id]?.price || 0;
      const trimmedLink = link.trim();
      const isAsin = ASIN_RE.test(trimmedLink);
      const openUrl = isAsin ? `https://www.amazon.com/dp/${encodeURIComponent(trimmedLink)}` : (trimmedLink.startsWith("http") ? trimmedLink : "");
      html += `<div class="owner-item" data-id="${item.id}">
        ${sealHtml(true, 20)}
        <div style="flex:1;min-width:0;">
          <div class="name">${item.name}</div>

      seal.addEventListener("click", () => toggleItem(flagged[idx].id));
    });
    ownerViewEl.querySelectorAll("[data-qty-down]").forEach(b => b.addEventListener("click", () => updateQty(b.dataset.qtyDown, -1)));
    ownerViewEl.querySelectorAll("[data-qty-up]").forEach(b => b.addEventListener("click", () => updateQty(b.dataset.qtyUp, 1)));
    ownerViewEl.querySelectorAll("[data-link-id]").forEach(input => {
      input.addEventListener("change", () => updateLink(input.dataset.linkId, input.value));
    });
    ownerViewEl.querySelectorAll("[data-price-id]").forEach(input => {
      input.addEventListener("change", () => updatePrice(input.dataset.priceId, input.value));
    });

    document.getElementById("copy-list-btn").addEventListener("click", async () => {
      const lines = flagged.map(i => `- ${i.name} x${state[i.id].qty || 1}`);
      const text = `Cio Bela Waxing Lounge — Order List\n${new Date().toLocaleDateString()}\n\n${lines.join("\n")}`;
      try {
        await navigator.clipboard.writeText(text);
        flashToast("Order list copied");
      } catch (e) {
        flashToast("Couldn't copy — select and copy manually");
      }
    });

    document.getElementById("mark-ordered-btn").addEventListener("click", () => {
      const controls = document.getElementById("clear-controls");
      controls.innerHTML = `<span style="font-size:12px;opacity:0.7;">Clear all ${flagged.length} flags?</span>
        <button class="btn-sm" id="confirm-yes" style="background:var(--bark);color:var(--cream);border:none;margin-left:6px;">Yes</button>
        <button class="btn-sm" id="confirm-no" style="background:transparent;color:var(--bark);border:1px solid var(--bark);margin-left:4px;">✕</button>`;
      document.getElementById("confirm-yes").addEventListener("click", async () => {
        const orderItems = flagged.map(i => ({
          name: i.name,
          qty: state[i.id].qty || 1,
          price: state[i.id].price || 0,
        }));
        const subtotal = orderItems.reduce((sum, i) => sum + i.price * i.qty, 0);
        const tax = subtotal * TAX_RATE;
        const total = subtotal + tax;
        try {
          await addDoc(ordersColRef, { items: orderItems, subtotal, tax, total, orderedAt: serverTimestamp() });
        } catch (e) {
          console.error("Couldn't save order history", e);
        }
        const next = { ...state };
        flagged.forEach(i => { next[i.id] = { ...next[i.id], checked: false }; });
        commit(next);
        flashToast("Order saved to history — flags reset");
      });
      document.getElementById("confirm-no").addEventListener("click", renderOwner);
    });

    document.getElementById("clear-all-btn").addEventListener("click", () => {
      const controls = document.getElementById("clear-all-controls");
      controls.innerHTML = `<span style="font-size:12px;opacity:0.7;">Are you sure you want to clear all?</span>
        <button class="btn-sm" id="clear-all-yes" style="background:var(--error);color:white;border:none;margin-left:6px;">Yes</button>
        <button class="btn-sm" id="clear-all-no" style="background:transparent;color:var(--bark);border:1px solid var(--bark);margin-left:4px;">No</button>`;
      document.getElementById("clear-all-yes").addEventListener("click", () => {
        const next = {};
        ALL_ITEMS.forEach(i => { next[i.id] = { ...state[i.id], checked: false }; });
        commit(next);
        flashToast("Everything cleared");
      });
      document.getElementById("clear-all-no").addEventListener("click", renderOwner);
    });
  }

  async function renderHistory() {
    const historyEl = document.getElementById("history-view");
    historyEl.innerHTML = `<div class="status-line">Loading past orders…</div>`;
    try {
      const q = query(ordersColRef, orderBy("orderedAt", "desc"), limit(50));
      const snap = await getDocs(q);
      if (snap.empty) {
        historyEl.innerHTML = `<div class="empty-box">
          <div class="empty-title">No orders yet</div>
          <div class="empty-sub">Once you mark an order as placed, it'll show up here with what was ordered and what it cost.</div>
        </div>`;
        return;
      }
      let html = "";
      snap.forEach(docSnap => {
        const order = docSnap.data();
        const dateStr = order.orderedAt?.toDate
          ? order.orderedAt.toDate().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
          : "Date unavailable";
        const lines = (order.items || []).map(i =>
          `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;">
            <span>${i.name} × ${i.qty}</span>
            <span style="opacity:0.7;">${i.price ? "$" + (i.price * i.qty).toFixed(2) : ""}</span>
          </div>`
        ).join("");
        const hasBreakdown = order.subtotal !== undefined && order.tax !== undefined;
        const breakdown = hasBreakdown
          ? `<div style="border-top:1px solid rgba(44,32,22,0.08);margin-top:8px;padding-top:8px;font-size:11.5px;opacity:0.65;">
              <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>$${order.subtotal.toFixed(2)}</span></div>
              <div style="display:flex;justify-content:space-between;"><span>Tax (8.25%)</span><span>$${order.tax.toFixed(2)}</span></div>
            </div>`
          : `<div style="font-size:10.5px;opacity:0.5;margin-top:8px;font-style:italic;">Placed before tax tracking was added — total shown is items only, no tax included.</div>`;
        html += `<div style="background:white;border:1px solid rgba(44,32,22,0.1);border-radius:10px;padding:14px 16px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
            <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--bark);">${dateStr}</span>
            <span style="font-size:14px;font-weight:500;color:var(--gold);">$${(order.total || 0).toFixed(2)}</span>
          </div>
          ${lines}
          ${breakdown}
        </div>`;
      });
      historyEl.innerHTML = html;
    } catch (e) {
      console.error("Couldn't load history", e);
      historyEl.innerHTML = `<div class="empty-box"><div class="empty-sub">Couldn't load order history — check your connection and try again.</div></div>`;
    }
  }

  async function renderRecipes() {
    const recipesEl = document.getElementById("recipes-view");
    recipesEl.innerHTML = `<div class="status-line">Loading recipes…</div>`;
    try {
      const snap = await getDoc(recipesDocRef);
      recipes = snap.exists() ? snap.data() : {};
    } catch (e) {
      console.error("Couldn't load recipes", e);
      recipes = {};
    }

    let html = `<div class="note" style="margin-bottom:18px;">
      These numbers are researched starting estimates, not exact figures — edit any field to match what you actually observe, and it saves automatically. "Gloves" applies to every service since a fresh pair is used per appointment.
    </div>`;

    SERVICES.forEach(service => {
      const saved = recipes[service.id] || {};
      html += `<div style="background:white;border:1px solid rgba(44,32,22,0.1);border-radius:10px;padding:14px 16px;margin-bottom:12px;">
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--bark);margin-bottom:10px;">${service.name}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">`;
      RECIPE_FIELDS.forEach(field => {
        const val = saved[field.key] !== undefined ? saved[field.key] : (service.defaults[field.key] !== undefined ? service.defaults[field.key] : "");
        html += `<label style="font-size:11px;opacity:0.7;display:flex;flex-direction:column;gap:3px;">
          ${field.label}
          <input type="text" inputmode="decimal" data-service="${service.id}" data-field="${field.key}" value="${val}" style="border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:13px;padding:4px 0;" />
        </label>`;
      });
      html += `</div></div>`;
    });

    recipesEl.innerHTML = html;
    recipesEl.querySelectorAll("input[data-service]").forEach(input => {
      input.addEventListener("change", () => {
        const serviceId = input.dataset.service;
        const field = input.dataset.field;
        const num = parseFloat(input.value);
        if (!recipes[serviceId]) recipes[serviceId] = {};
        if (isNaN(num)) {
          delete recipes[serviceId][field];
        } else {
          recipes[serviceId][field] = num;
        }
        setDoc(recipesDocRef, recipes).catch(e => console.error("Couldn't save recipe", e));
      });
    });
  }

  function consumableTotal(serviceCounts) {
    // serviceCounts: { serviceId: count }. Returns totals per recipe field across those services.
    const totals = {};
    RECIPE_FIELDS.forEach(f => totals[f.key] = 0);
    Object.entries(serviceCounts).forEach(([serviceId, count]) => {
      const recipe = recipes[serviceId] || {};
      RECIPE_FIELDS.forEach(f => {
        if (recipe[f.key]) totals[f.key] += recipe[f.key] * count;
      });
    });
    return totals;
  }

  async function generateReport(specialistId, orderId) {
    const outputEl = document.getElementById("report-output");
    outputEl.innerHTML = `<div class="status-line">Generating report…</div>`;

    try {
      const recipeSnap = await getDoc(recipesDocRef);
      recipes = recipeSnap.exists() ? recipeSnap.data() : {};
    } catch (e) { console.error(e); }

    const orderIndex = allOrdersCache.findIndex(o => o.id === orderId);
    const selectedOrder = allOrdersCache[orderIndex];
    const orderTotal = selectedOrder?.total || 0;
    const periodEnd = selectedOrder?.orderedAt?.toDate ? selectedOrder.orderedAt.toDate() : new Date();
    const periodStart = orderIndex > 0 && allOrdersCache[orderIndex - 1].orderedAt?.toDate
      ? allOrdersCache[orderIndex - 1].orderedAt.toDate()
      : null;
    const periodLabel = periodStart
      ? `${periodStart.toLocaleDateString()} – ${periodEnd.toLocaleDateString()} (Order #${orderIndex + 1})`
      : `through ${periodEnd.toLocaleDateString()} (Order #${orderIndex + 1}, earliest on record)`;

    let allLogs = [];
    try {
      const logSnap = await getDocs(serviceLogColRef);
      logSnap.forEach(d => allLogs.push(d.data()));
    } catch (e) { console.error(e); }

    const inPeriod = allLogs.filter(l => {
      const d = new Date(l.date);
      return (!periodStart || d >= periodStart) && d <= periodEnd;
    });

    const bySpecialist = {};
    SPECIALISTS.forEach(s => bySpecialist[s.id] = {});
    inPeriod.forEach(l => {
      if (!bySpecialist[l.specialistId]) bySpecialist[l.specialistId] = {};
      bySpecialist[l.specialistId][l.serviceId] = (bySpecialist[l.specialistId][l.serviceId] || 0) + 1;
    });

    const specialist = SPECIALISTS.find(s => s.id === specialistId);
    const specialistCounts = bySpecialist[specialistId] || {};
    const specialistTotals = consumableTotal(specialistCounts);
    const specialistWax = (specialistTotals.hardWax || 0) + (specialistTotals.softWax || 0);

    let everyoneWax = 0;
    SPECIALISTS.forEach(s => {
      const t = consumableTotal(bySpecialist[s.id] || {});
      everyoneWax += (t.hardWax || 0) + (t.softWax || 0);
    });
    const pct = everyoneWax > 0 ? Math.round((specialistWax / everyoneWax) * 100) : 0;
    const charge = everyoneWax > 0 ? (specialistWax / everyoneWax) * orderTotal : 0;

    const servicesPerformed = Object.entries(specialistCounts);
    const totalServices = servicesPerformed.reduce((sum, [, c]) => sum + c, 0);

    if (totalServices === 0) {
      outputEl.innerHTML = `<div class="empty-box">
        <div class="empty-title">No logged services for ${specialist.name}</div>
        <div class="empty-sub">Nothing recorded for this order's period yet. Log services above, or ask Claude to sync from her calendar.</div>
      </div>`;
      return;
    }

    const pieDeg = Math.round(pct * 3.6);
    let html = `<div style="background:white;border:1px solid rgba(44,32,22,0.1);border-radius:12px;padding:20px;">
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--bark);">${specialist.name}'s Consumption Report</div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-top:4px;">Period: ${periodLabel}</div>
      </div>
      <div style="text-align:center;background:linear-gradient(135deg, var(--bark), #241a12);color:var(--cream);border-radius:12px;padding:16px;margin-bottom:18px;">
        <div style="font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light);opacity:0.85;">Share of Order #${orderIndex + 1}'s Cost</div>
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:38px;margin:4px 0 2px;">$${charge.toFixed(2)}</div>
        <div style="font-size:11px;opacity:0.65;">${pct}% of $${orderTotal.toFixed(2)} total</div>
      </div>
      <div style="display:flex;justify-content:center;margin:20px 0;">
        <div style="width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--gold) 0deg ${pieDeg}deg, rgba(44,32,22,0.12) ${pieDeg}deg 360deg);display:flex;align-items:center;justify-content:center;">
          <div style="width:100px;height:100px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--bark);">${pct}%</div>
            <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.6;">of wax used</div>
          </div>
        </div>
      </div>
      <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;">
        <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">Services performed (${totalServices} total)</div>
        ${servicesPerformed.map(([sid, count]) => {
          const s = SERVICES.find(x => x.id === sid);
          return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span>${s ? s.name : sid}</span><span style="opacity:0.7;">× ${count}</span></div>`;
        }).join("")}
      </div>
      <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;margin-top:14px;">
        <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">Estimated consumption</div>
        ${RECIPE_FIELDS.filter(f => specialistTotals[f.key] > 0).map(f =>
          `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span>${f.label}</span><span style="opacity:0.7;">${specialistTotals[f.key].toFixed(1)}</span></div>`
        ).join("")}
      </div>
      <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;margin-top:14px;">
        <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">These conclusions were based on the following data</div>
        <div style="font-size:11px;opacity:0.7;line-height:1.6;">
          Billed against: Order #${orderIndex + 1}, placed ${periodEnd.toLocaleDateString()}, total $${orderTotal.toFixed(2)}.<br/>
          Period covered: ${periodLabel}.<br/>
          Recipe values used (live from the Recipes tab at the time this report was generated):
          ${servicesPerformed.map(([sid]) => {
            const s = SERVICES.find(x => x.id === sid);
            const r = recipes[sid] || {};
            const parts = RECIPE_FIELDS.filter(f => r[f.key]).map(f => `${f.label.toLowerCase()}: ${r[f.key]}`).join(", ");
            return `<br/>— ${s ? s.name : sid}: ${parts || "no recipe set"}`;
          }).join("")}
          <br/><br/>
          Total wax used across all specialists in this period: ${everyoneWax.toFixed(1)}g. ${specialist.name}'s share: ${specialistWax.toFixed(1)}g (${pct}%).<br/>
          Charge = ${pct}% × $${orderTotal.toFixed(2)} = <b>$${charge.toFixed(2)}</b>.
        </div>
      </div>
    </div>`;
    outputEl.innerHTML = html;
  }

  function switchView(v) {
    view = v;
    hasNavigated = true;
    document.getElementById("tab-team").classList.toggle("active", v === "team");
    document.getElementById("tab-owner").classList.toggle("active", v === "owner");
    document.getElementById("tab-history").classList.toggle("active", v === "history");
    document.getElementById("tab-recipes").classList.toggle("active", v === "recipes");
    document.getElementById("tab-reports").classList.toggle("active", v === "reports");
    teamViewEl.classList.toggle("hidden", v !== "team");
    document.getElementById("history-view").classList.toggle("hidden", v !== "history");
    document.getElementById("recipes-view").classList.toggle("hidden", v !== "recipes" || !(unlocked || SKIP_PASSCODE));
    document.getElementById("reports-view").classList.toggle("hidden", v !== "reports" || !(unlocked || SKIP_PASSCODE));

    if (v === "history") {
      ownerLockEl.classList.add("hidden");
      ownerViewEl.classList.add("hidden");
      renderHistory();
    } else if (v === "team") {
      unlocked = SKIP_PASSCODE;
      ownerLockEl.classList.add("hidden");
      ownerViewEl.classList.add("hidden");
    } else if (v === "recipes") {
      ownerViewEl.classList.add("hidden");
      if (unlocked || SKIP_PASSCODE) {
        ownerLockEl.classList.add("hidden");
        renderRecipes();
      } else {
        ownerLockEl.classList.remove("hidden");
      }
    } else if (v === "reports") {
      ownerViewEl.classList.add("hidden");
      if (unlocked || SKIP_PASSCODE) {
        ownerLockEl.classList.add("hidden");
        renderReports();
      } else {
        ownerLockEl.classList.remove("hidden");
      }
    } else {
      ownerViewEl.classList.toggle("hidden", !(unlocked || SKIP_PASSCODE));
      if (unlocked || SKIP_PASSCODE) {
        ownerLockEl.classList.add("hidden");
        renderOwner();
      } else {
        ownerLockEl.classList.remove("hidden");
      }
    }

    document.querySelector(".wrap").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("tab-reports").addEventListener("click", () => switchView("reports"));
  document.getElementById("tab-recipes").addEventListener("click", () => switchView("recipes"));
  document.getElementById("tab-team").addEventListener("click", () => switchView("team"));
  document.getElementById("tab-owner").addEventListener("click", () => switchView("owner"));
  document.getElementById("tab-history").addEventListener("click", () => switchView("history"));
  document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
  document.getElementById("passcode-input").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

  function tryUnlock() {
    const input = document.getElementById("passcode-input");
    const errorEl = document.getElementById("passcode-error");
    if (input.value === OWNER_PASSCODE) {
      unlocked = true;
      input.value = "";
      errorEl.classList.add("hidden");
      ownerLockEl.classList.add("hidden");
      if (view === "recipes") {
        document.getElementById("recipes-view").classList.remove("hidden");
        renderRecipes();
      } else if (view === "reports") {
        document.getElementById("reports-view").classList.remove("hidden");
        renderReports();
      } else {
        ownerViewEl.classList.remove("hidden");
        renderOwner();
      }
    } else {
      errorEl.classList.remove("hidden");
      input.classList.add("error");
    }
  }

  // Real-time listener — every device sees changes instantly
  onSnapshot(stateDocRef, (snap) => {
    loadingEl.classList.add("hidden");
    if (snap.exists()) {
      const data = snap.data();
      state = { ...defaultState(), ...state, ...data };
    } else {
      // First run ever — seed the document
      setDoc(stateDocRef, defaultState()).catch(e => console.error(e));
    }
    renderTeam();
    if (view === "owner" && (unlocked || SKIP_PASSCODE)) renderOwner();
  }, (err) => {
    console.error("Listener error", err);
    loadingEl.textContent = "Couldn't connect — check Firestore rules.";
    loadingEl.classList.remove("hidden");
  });
</script>
</body>
</html>
