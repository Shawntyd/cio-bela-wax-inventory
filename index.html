  // Resizes/compresses an image file in-browser and returns a small base64 data URL,
  // small enough to store directly in a Firestore document (free — no Storage/Blaze needed).
  function compressImage(file, maxDim = 1000, quality = 0.6) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });

      { id: "wood-spatulas-medium", name: "Wooden spatulas (medium)" },
      { id: "wood-spatulas-large", name: "Wooden spatulas (large)" },
    ]},
    { id: "care", label: "Pre & Post-Care Solutions", items: [
      { id: "pre-cleanse", name: "Pre cleanse" },
      { id: "pre-wax-oil", name: "Pre wax oil" },
      { id: "baby-powder", name: "Baby powder" },
      { id: "post-wax-spray", name: "Post wax — hypochlorous spray" },
      { id: "calming-cream", name: "Calming cream" },
      { id: "witch-hazel", name: "Witch hazel" },
      { id: "wax-remover", name: "Wax remover" },
      { id: "intimate-wipes", name: "Intimate Refreshing Wipes - Backbar" },
    ]},
    { id: "sanitation", label: "Sanitation & Safety Protocol", items: [
      { id: "epa-disinfectant", name: "EPA-registered disinfectant" },
      { id: "barbicide", name: "Barbicide" },
      { id: "hand-sanitizer", name: "Hand sanitizer" },
      { id: "nitrile-gloves", name: "Nitrile gloves" },
    ]},
    { id: "tools", label: "Professional Tools", items: [
      { id: "tweezers", name: "Tweezers" },
      { id: "brow-scissors", name: "Brow scissors" },
      { id: "handheld-mirror", name: "Handheld mirror" },
      { id: "handheld-fan", name: "Handheld fan" },
      { id: "mapping-thread", name: "Mapping thread" },
    ]},
    { id: "disposables", label: "Disposables & Linens", items: [
      { id: "bed-paper", name: "Bed paper" },
      { id: "cotton-rounds", name: "Cotton rounds" },
      { id: "cotton-balls", name: "Cotton balls" },
      { id: "paper-towels", name: "Paper towels" },
    ]},
  ];
  const ALL_ITEMS = CATEGORIES.flatMap(c => c.items.map(i => ({ ...i, category: c.label })));

  function defaultState() {
    const s = {};
    ALL_ITEMS.forEach(i => { s[i.id] = { checked: false, qty: 1, link: "", price: 0, shipping: 0, tax: null }; });
    return s;
  }

  let state = defaultState();
  let view = "team";
  let hasNavigated = false;
  let unlocked = SKIP_PASSCODE;
  let suppressNextRenderConflict = false;

  const teamViewEl = document.getElementById("team-view");
  const ownerViewEl = document.getElementById("owner-view");
  const ownerLockEl = document.getElementById("owner-lock");
  const loadingEl = document.getElementById("loading");
  const toastEl = document.getElementById("toast");

  function flashToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    setTimeout(() => { toastEl.style.display = "none"; }, 2200);
  }

  const lightboxEl = document.getElementById("receipt-lightbox");
  const lightboxImgEl = document.getElementById("lightbox-img");
  function openLightbox(src) {
    lightboxImgEl.src = src;
    lightboxEl.classList.remove("hidden");
  }
  function closeLightbox() {
    lightboxEl.classList.add("hidden");
    lightboxImgEl.src = "";
  }
  lightboxEl.addEventListener("click", closeLightbox);
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  // Delegated listener so this works for thumbnails rendered later (Order History, Reports)
  document.addEventListener("click", (e) => {
    if (e.target.classList && e.target.classList.contains("receipt-thumb")) {
      openLightbox(e.target.src);
    }
  });

  async function commit(next) {
    state = next;
    try {
      await setDoc(stateDocRef, next, { merge: true });
    } catch (e) {
      console.error("Save failed", e);
      flashToast("Couldn't save — check your connection");
    }
  }

  function toggleItem(id) {
    hasNavigated = true;
    const next = { ...state, [id]: { ...state[id], checked: !state[id].checked } };
    commit(next);
  }

  function updateQty(id, delta) {
    const cur = state[id].qty || 1;
    const qty = Math.max(1, cur + delta);
    commit({ ...state, [id]: { ...state[id], qty } });
    renderOwner();
  }

  function updateLink(id, link) {
    state = { ...state, [id]: { ...state[id], link } };
    setDoc(stateDocRef, state, { merge: true }).catch(e => console.error(e));
  }

  function updatePrice(id, priceStr) {
    const price = Math.max(0, parseFloat(priceStr) || 0);
    state = { ...state, [id]: { ...state[id], price } };
    setDoc(stateDocRef, state, { merge: true }).catch(e => console.error(e));
    renderTeam();
    if (view === "owner") renderOwner();
  }

  function updateShipping(id, shippingStr) {
    const shipping = Math.max(0, parseFloat(shippingStr) || 0);
    state = { ...state, [id]: { ...state[id], shipping } };
    setDoc(stateDocRef, state, { merge: true }).catch(e => console.error(e));
    renderTeam();
    if (view === "owner") renderOwner();
  }

  function updateTax(id, taxStr) {
    const tax = taxStr.trim() === "" ? null : Math.max(0, parseFloat(taxStr) || 0);
    state = { ...state, [id]: { ...state[id], tax } };
    setDoc(stateDocRef, state, { merge: true }).catch(e => console.error(e));
    renderTeam();
    if (view === "owner") renderOwner();
  }

  function sealHtml(checked, size = 26) {
    return `<div class="seal ${checked ? 'checked' : ''}" style="width:${size}px;height:${size}px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1410" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>`;
  }

  function renderTeam() {
    const flagged = ALL_ITEMS.filter(i => state[i.id]?.checked);
    let html = `<div class="status-line">${
      flagged.length === 0
        ? "Everything's stocked. Check an item the moment it's running low."
        : flagged.length + " item" + (flagged.length === 1 ? "" : "s") + " flagged for reorder."
    }</div>`;

    CATEGORIES.forEach(cat => {
      html += `<div class="category"><div class="cat-label">${cat.label}</div>`;
      cat.items.forEach(item => {
        const checked = !!state[item.id]?.checked;
        html += `<div class="item-row" data-id="${item.id}">
          ${sealHtml(checked)}
          <span class="item-name ${checked ? 'checked' : ''}">${item.name}</span>
        </div>`;
      });
      html += `</div>`;
    });
    teamViewEl.innerHTML = html;
    teamViewEl.querySelectorAll(".item-row").forEach(row => {
      row.addEventListener("click", () => toggleItem(row.dataset.id));
    });
    updateTotalBar(flagged);
  }

  const TAX_RATE = 0.0825;

  function effectiveTax(itemId) {
    const s = state[itemId];
    if (!s) return 0;
    const estimate = (s.price || 0) * (s.qty || 1) * TAX_RATE;
    return s.tax !== null && s.tax !== undefined ? s.tax : estimate;
  }

  function updateTotalBar(flagged) {
    const totalBar = document.getElementById("total-bar");
    const totalAmount = document.getElementById("total-amount");
    const disclaimerEl = document.getElementById("total-disclaimer");
    if (flagged.length === 0 || !hasNavigated) {
      totalBar.classList.add("hidden");
      return;
    }
    const subtotal = flagged.reduce((sum, i) => sum + (state[i.id].price || 0) * (state[i.id].qty || 1), 0);
    const tax = flagged.reduce((sum, i) => sum + effectiveTax(i.id), 0);
    const shipping = flagged.reduce((sum, i) => sum + (state[i.id].shipping || 0), 0);
    const total = subtotal + tax + shipping;
    totalAmount.textContent = "$" + total.toFixed(2);
    disclaimerEl.textContent = `Tax $${tax.toFixed(2)} (real if entered, est. 8.25% otherwise) + shipping $${shipping.toFixed(2)} — edit either in Owner Dashboard to match receipts`;
    totalBar.classList.remove("hidden");
  }

  function renderOwner() {
    const flagged = ALL_ITEMS.filter(i => state[i.id]?.checked);
    if (flagged.length === 0) {
      ownerViewEl.innerHTML = `<div class="empty-box">
        <div class="empty-title">Nothing flagged yet</div>
        <div class="empty-sub">Once the team checks items off, they'll show up here to order.</div>
      </div>`;
      return;
    }

    let html = `<div class="actions">
      <button class="btn" id="copy-list-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg> Copy order list</button>
      <span id="clear-controls"><button class="btn muted" id="mark-ordered-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"></path><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"></path></svg> Mark ordered</button></span>
      <span id="clear-all-controls"><button class="btn muted" id="clear-all-btn" style="border-color:var(--error);color:var(--error);">Clear all</button></span>
    </div>
    <div class="note">For Amazon items with an ASIN saved, tap "Open" to jump straight to that exact product page and tap Add to Cart there. For anything else, use "Copy order list" and paste it into that site's search. Since items come from different sites, shipping and tax are entered per item below (tax defaults to an 8.25% estimate shown as the placeholder — type in the real number from the receipt once you have it, for accurate records).</div>`;

    flagged.forEach(item => {
      const link = state[item.id]?.link || "";
      const qty = state[item.id]?.qty || 1;
      const price = state[item.id]?.price || 0;
      const shipping = state[item.id]?.shipping || 0;
      const trimmedLink = link.trim();
      const isAsin = ASIN_RE.test(trimmedLink);
      const openUrl = isAsin ? `https://www.amazon.com/dp/${encodeURIComponent(trimmedLink)}` : (trimmedLink.startsWith("http") ? trimmedLink : "");
      html += `<div class="owner-item" data-id="${item.id}" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div style="display:flex;align-items:center;gap:10px;">
          ${sealHtml(true, 20)}
          <div class="name" style="flex:1;">${item.name}</div>
          ${openUrl ? `<a href="${openUrl}" target="_blank" rel="noreferrer" style="font-size:11px;font-weight:500;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:5px 8px;white-space:nowrap;">Open</a>` : ""}
        </div>
        <input type="text" placeholder="ASIN or product link (optional)" value="${link.replace(/"/g, '&quot;')}" data-link-id="${item.id}" style="width:100%;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:12px;padding:4px 0;" />
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <label style="display:flex;flex-direction:column;gap:2px;font-size:10px;opacity:0.6;">
            Price
            <span style="display:flex;align-items:center;gap:2px;">
              <span style="font-size:12px;opacity:0.6;">$</span>
              <input type="text" inputmode="decimal" placeholder="0.00" value="${price ? price.toFixed(2) : ''}" data-price-id="${item.id}" style="width:56px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:12px;padding:3px 0;" />
            </span>
          </label>
          <label style="display:flex;flex-direction:column;gap:2px;font-size:10px;opacity:0.6;">
            Shipping
            <span style="display:flex;align-items:center;gap:2px;">
              <span style="font-size:12px;opacity:0.6;">$</span>
              <input type="text" inputmode="decimal" placeholder="0.00" value="${shipping ? shipping.toFixed(2) : ''}" data-shipping-id="${item.id}" style="width:56px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:12px;padding:3px 0;" />
            </span>
          </label>
          <label style="display:flex;flex-direction:column;gap:2px;font-size:10px;opacity:0.6;">
            Tax <span style="opacity:0.6;">(from receipt)</span>
            <span style="display:flex;align-items:center;gap:2px;">
              <span style="font-size:12px;opacity:0.6;">$</span>
              <input type="text" inputmode="decimal" placeholder="${(price * qty * TAX_RATE).toFixed(2)} est." value="${state[item.id].tax !== null && state[item.id].tax !== undefined ? state[item.id].tax.toFixed(2) : ''}" data-tax-id="${item.id}" style="width:64px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:12px;padding:3px 0;" />
            </span>
          </label>
          <div class="stepper" style="margin-left:auto;">
            <button class="step-btn" data-qty-down="${item.id}">−</button>
            <span class="qty">${qty}</span>
            <button class="step-btn" data-qty-up="${item.id}">+</button>
          </div>
        </div>
      </div>`;
    });

    ownerViewEl.innerHTML = html;
    updateTotalBar(flagged);

    ownerViewEl.querySelectorAll(".seal").forEach((seal, idx) => {
      seal.addEventListener("click", () => toggleItem(flagged[idx].id));
    });
    ownerViewEl.querySelectorAll("[data-qty-down]").forEach(b => b.addEventListener("click", () => updateQty(b.dataset.qtyDown, -1)));
    ownerViewEl.querySelectorAll("[data-qty-up]").forEach(b => b.addEventListener("click", () => updateQty(b.dataset.qtyUp, 1)));
    ownerViewEl.querySelectorAll("[data-link-id]").forEach(input => {
      input.addEventListener("change", () => updateLink(input.dataset.linkId, input.value));
    });
    ownerViewEl.querySelectorAll("[data-price-id]").forEach(input => {
      input.addEventListener("change", () => updatePrice(input.dataset.priceId, input.value));
    });
    ownerViewEl.querySelectorAll("[data-shipping-id]").forEach(input => {
      input.addEventListener("change", () => updateShipping(input.dataset.shippingId, input.value));
    });
    ownerViewEl.querySelectorAll("[data-tax-id]").forEach(input => {
      input.addEventListener("change", () => updateTax(input.dataset.taxId, input.value));
    });

    document.getElementById("copy-list-btn").addEventListener("click", async () => {
      const lines = flagged.map(i => `- ${i.name} x${state[i.id].qty || 1}`);
      const text = `Cio Bela Waxing Lounge — Order List\n${new Date().toLocaleDateString()}\n\n${lines.join("\n")}`;
      try {
        await navigator.clipboard.writeText(text);
        flashToast("Order list copied");
      } catch (e) {
        flashToast("Couldn't copy — select and copy manually");
      }
    });

    document.getElementById("mark-ordered-btn").addEventListener("click", () => {
      const controls = document.getElementById("clear-controls");
      controls.innerHTML = `<span style="font-size:12px;opacity:0.7;">Clear all ${flagged.length} flags?</span>
        <button class="btn-sm" id="confirm-yes" style="background:var(--bark);color:var(--cream);border:none;margin-left:6px;">Yes</button>
        <button class="btn-sm" id="confirm-no" style="background:transparent;color:var(--bark);border:1px solid var(--bark);margin-left:4px;">✕</button>`;
      document.getElementById("confirm-yes").addEventListener("click", async () => {
        const orderItems = flagged.map(i => ({
          name: i.name,
          qty: state[i.id].qty || 1,
          price: state[i.id].price || 0,
          shipping: state[i.id].shipping || 0,
          tax: effectiveTax(i.id),
        }));
        const subtotal = orderItems.reduce((sum, i) => sum + i.price * i.qty, 0);
        const tax = orderItems.reduce((sum, i) => sum + i.tax, 0);
        const shipping = orderItems.reduce((sum, i) => sum + (i.shipping || 0), 0);
        const total = subtotal + tax + shipping;
        try {
          await addDoc(ordersColRef, { items: orderItems, subtotal, tax, shipping, total, orderedAt: serverTimestamp() });
        } catch (e) {
          console.error("Couldn't save order history", e);
        }
        const next = { ...state };
        flagged.forEach(i => { next[i.id] = { ...next[i.id], checked: false }; });
        commit(next);
        flashToast("Order saved to history — flags reset");
      });
      document.getElementById("confirm-no").addEventListener("click", renderOwner);
    });

    document.getElementById("clear-all-btn").addEventListener("click", () => {
      const controls = document.getElementById("clear-all-controls");
      controls.innerHTML = `<span style="font-size:12px;opacity:0.7;">Are you sure you want to clear all?</span>
        <button class="btn-sm" id="clear-all-yes" style="background:var(--error);color:white;border:none;margin-left:6px;">Yes</button>
        <button class="btn-sm" id="clear-all-no" style="background:transparent;color:var(--bark);border:1px solid var(--bark);margin-left:4px;">No</button>`;
      document.getElementById("clear-all-yes").addEventListener("click", () => {
        const next = {};
        ALL_ITEMS.forEach(i => { next[i.id] = { ...state[i.id], checked: false }; });
        commit(next);
        flashToast("Everything cleared");
      });
      document.getElementById("clear-all-no").addEventListener("click", renderOwner);
    });
  }

  async function renderHistory() {
    const historyEl = document.getElementById("history-view");
    historyEl.innerHTML = `<div class="status-line">Loading past orders…</div>`;
    try {
      const q = query(ordersColRef, orderBy("orderedAt", "desc"), limit(50));
      const snap = await getDocs(q);
      if (snap.empty) {
        historyEl.innerHTML = `<div class="empty-box">
          <div class="empty-title">No orders yet</div>
          <div class="empty-sub">Once you mark an order as placed, it'll show up here with what was ordered and what it cost.</div>
        </div>`;
        return;
      }

      // Pull every receipt doc and group by orderId
      const receiptsByOrder = {};
      try {
        const receiptSnap = await getDocs(receiptsColRef);
        receiptSnap.forEach(rDoc => {
          const r = rDoc.data();
          if (!receiptsByOrder[r.orderId]) receiptsByOrder[r.orderId] = [];
          receiptsByOrder[r.orderId].push({ id: rDoc.id, ...r });
        });
      } catch (e) { console.error("Couldn't load receipts", e); }

      let html = "";
      snap.forEach(docSnap => {
        const order = docSnap.data();
        const dateStr = order.orderedAt?.toDate
          ? order.orderedAt.toDate().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
          : "Date unavailable";
        const lines = (order.items || []).map((i, idx) =>
          `<div class="order-line-view" data-order="${docSnap.id}" style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;">
            <span>${i.name} × ${i.qty}</span>
            <span style="opacity:0.7;">${i.price ? "$" + (i.price * i.qty).toFixed(2) : ""}</span>
          </div>`
        ).join("");
        const editLines = (order.items || []).map((i, idx) =>
          `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;flex-wrap:wrap;">
            <input type="checkbox" class="bundle-select-${docSnap.id}" data-bundle-idx="${idx}" style="width:15px;height:15px;flex-shrink:0;" />
            <span style="flex:1;min-width:80px;">${i.name} × ${i.qty}</span>
            <label style="display:flex;align-items:center;gap:2px;opacity:0.7;">P $<input type="text" inputmode="decimal" value="${(i.price || 0).toFixed(2)}" data-edit-price="${idx}" style="width:50px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-size:12px;" /></label>
            <label style="display:flex;align-items:center;gap:2px;opacity:0.7;">S $<input type="text" inputmode="decimal" value="${(i.shipping || 0).toFixed(2)}" data-edit-shipping="${idx}" style="width:50px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-size:12px;" /></label>
            <label style="display:flex;align-items:center;gap:2px;opacity:0.7;">T $<input type="text" inputmode="decimal" value="${(i.tax || 0).toFixed(2)}" data-edit-tax="${idx}" style="width:50px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-size:12px;" /></label>
          </div>`
        ).join("");
        const bundleToolbar = `<div style="background:rgba(184,147,90,0.08);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:11px;">
          <div style="opacity:0.75;margin-bottom:6px;">Check items from the same receipt, enter that receipt's total shipping + tax, and split it across just those items:</div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <label style="display:flex;align-items:center;gap:2px;">Shipping $<input type="text" inputmode="decimal" placeholder="0.00" id="bundle-shipping-${docSnap.id}" style="width:56px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-size:12px;" /></label>
            <label style="display:flex;align-items:center;gap:2px;">Tax $<input type="text" inputmode="decimal" placeholder="0.00" id="bundle-tax-${docSnap.id}" style="width:56px;border:none;border-bottom:1px solid var(--gold-light);outline:none;background:transparent;font-size:12px;" /></label>
            <button type="button" class="btn-sm" data-apply-bundle="${docSnap.id}" style="background:var(--gold);color:var(--charcoal);border:none;">Split across checked</button>
          </div>
        </div>`;
        const hasBreakdown = order.subtotal !== undefined && order.tax !== undefined;
        const breakdown = hasBreakdown
          ? `<div style="border-top:1px solid rgba(44,32,22,0.08);margin-top:8px;padding-top:8px;font-size:11.5px;opacity:0.65;">
              <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>$${order.subtotal.toFixed(2)}</span></div>
              <div style="display:flex;justify-content:space-between;"><span>Tax</span><span>$${order.tax.toFixed(2)}</span></div>
              <div style="display:flex;justify-content:space-between;"><span>Shipping</span><span>${order.shipping !== undefined ? "$" + order.shipping.toFixed(2) : "not tracked"}</span></div>
            </div>`
          : `<div style="font-size:10.5px;opacity:0.5;margin-top:8px;font-style:italic;">Placed before tax tracking was added — total shown is items only, no tax or shipping included.</div>`;

        const receipts = receiptsByOrder[docSnap.id] || [];
        const receiptGallery = receipts.length > 0
          ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">
              ${receipts.map(r => `
                <span style="position:relative;display:inline-block;">
                  <img src="${r.imageData}" class="receipt-thumb" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gold-light);display:block;cursor:pointer;" />
                  <button data-delete-receipt="${r.id}" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--error);color:white;border:none;font-size:11px;line-height:1;cursor:pointer;">×</button>
                </span>`).join("")}
            </div>`
          : "";
        const receiptSection = `<div style="margin-top:6px;">
          ${receiptGallery}
          <label style="font-size:11px;color:var(--gold);cursor:pointer;text-decoration:underline;display:inline-block;margin-top:6px;">
            ${receipts.length > 0 ? "Add more receipt photos" : "Attach receipt photos"}
            <input type="file" accept="image/*" multiple data-receipt-for="${docSnap.id}" style="display:none;" />
          </label>
        </div>`;

        html += `<div style="background:white;border:1px solid rgba(44,32,22,0.1);border-radius:10px;padding:14px 16px;margin-bottom:12px;">

        const field = input.dataset.field;
        const num = parseFloat(input.value);
        if (!recipes[serviceId]) recipes[serviceId] = {};
        if (isNaN(num)) {
          delete recipes[serviceId][field];

        }
        setDoc(recipesDocRef, recipes).catch(e => console.error("Couldn't save recipe", e));
      });

  function consumableTotal(serviceCounts) {
    // serviceCounts: { serviceId: count }. Returns totals per recipe field across those services.
    const totals = {};
    RECIPE_FIELDS.forEach(f => totals[f.key] = 0);
    Object.entries(serviceCounts).forEach(([serviceId, count]) => {
      const recipe = recipes[serviceId] || {};
      RECIPE_FIELDS.forEach(f => {
        if (recipe[f.key]) totals[f.key] += recipe[f.key] * count;
      });
    });
    return totals;
  }

            <select id="report-order" style="padding:8px;border-radius:6px;border:1px solid var(--gold-light);font-family:'Jost',sans-serif;">
              ${orderOptions}
            </select>
            <button class="btn" id="generate-report-btn" style="align-self:flex-start;">Generate report</button>
          </div>`
      }
    </div>
    <div id="report-output"></div>`;

    reportsEl.innerHTML = html;

    document.getElementById("copy-claude-request-btn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(claudeRequestText);
        flashToast("Copied — paste it to Claude");
      } catch (e) {
        flashToast("Couldn't copy — select and copy manually");
      }
    });

    reportsEl.querySelectorAll("[data-edit-log]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.editLog;
        document.getElementById(`log-view-${id}`).classList.add("hidden");
        document.getElementById(`log-edit-${id}`).classList.remove("hidden");
      });
    });
    reportsEl.querySelectorAll("[data-cancel-log]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.cancelLog;
        document.getElementById(`log-edit-${id}`).classList.add("hidden");
        document.getElementById(`log-view-${id}`).classList.remove("hidden");
      });
    });
    reportsEl.querySelectorAll("[data-save-log]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.saveLog;
        const specialistId = document.querySelector(`[data-edit-log-specialist="${id}"]`).value;
        const serviceId = document.querySelector(`[data-edit-log-service="${id}"]`).value;
        const date = document.querySelector(`[data-edit-log-date="${id}"]`).value;
        try {
          await setDoc(doc(db, "service-log", id), { specialistId, serviceId, date }, { merge: false });
          flashToast("Updated");
          renderReports();
        } catch (e) {
          console.error("Couldn't update log entry", e);
          flashToast("Couldn't save — check connection");
        }
      });
    });

    reportsEl.querySelectorAll("[data-delete-log]").forEach(btn => {
      btn.addEventListener("click", async () => {
        try {
          await deleteDoc(doc(db, "service-log", btn.dataset.deleteLog));
          flashToast("Removed");
          renderReports();
        } catch (e) {
          console.error("Couldn't delete log entry", e);
          flashToast("Couldn't delete — check connection");
        }
      });
    });

    reportsEl.querySelectorAll("[data-delete-saved-report]").forEach(btn => {
      btn.addEventListener("click", async () => {
        try {
          await deleteDoc(doc(db, "saved-reports", btn.dataset.deleteSavedReport));
          flashToast("Deleted — no longer visible to her");
          renderReports();
        } catch (e) {
          console.error("Couldn't delete saved report", e);
          flashToast("Couldn't delete — check connection");
        }
      });
    });

    document.getElementById("bulk-import-btn").addEventListener("click", async () => {
      const resultEl = document.getElementById("bulk-import-result");
      const text = document.getElementById("bulk-import-text").value.trim();
      if (!text) return;
      const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      const toImport = [];
      const failed = [];
      lines.forEach(line => {
        const parts = line.split(",").map(p => p.trim());
        if (parts.length < 3) { failed.push(line); return; }
        const [specName, serviceName, date] = parts;
        const specialist = SPECIALISTS.find(s => s.name.toLowerCase() === specName.toLowerCase());
        const service = SERVICES.find(s => s.name.toLowerCase() === serviceName.toLowerCase());
        const validDate = /^\d{4}-\d{2}-\d{2}$/.test(date);
        if (!specialist || !service || !validDate) { failed.push(line); return; }
        toImport.push({ specialistId: specialist.id, serviceId: service.id, date });
      });
      if (toImport.length === 0) {
        resultEl.innerHTML = `<span style="color:var(--error);">Nothing matched — check the format matches "Specialist, Service, YYYY-MM-DD" exactly.</span>`;
        return;
      }
      resultEl.textContent = `Importing ${toImport.length}…`;
      try {
        for (const entry of toImport) {
          await addDoc(serviceLogColRef, entry);
        }
        let msg = `<span style="color:var(--gold);">Imported ${toImport.length} entr${toImport.length === 1 ? "y" : "ies"}.</span>`;
        if (failed.length > 0) {
          msg += `<br/><span style="color:var(--error);">${failed.length} line${failed.length > 1 ? "s" : ""} couldn't be matched and were skipped:</span><br/>${failed.map(l => `<span style="opacity:0.7;">${l}</span>`).join("<br/>")}`;
        }
        resultEl.innerHTML = msg;
        document.getElementById("bulk-import-text").value = failed.join("\n");
        flashToast(`Imported ${toImport.length} service${toImport.length > 1 ? "s" : ""}`);
      } catch (e) {
        console.error("Bulk import failed", e);
        resultEl.innerHTML = `<span style="color:var(--error);">Import failed partway — check connection and try again with what's left in the box.</span>`;
      }
    });

    document.getElementById("log-service-btn").addEventListener("click", async () => {
      const specialistId = document.getElementById("log-specialist").value;
      const serviceId = document.getElementById("log-service").value;
      const date = document.getElementById("log-date").value;
      try {
        await addDoc(serviceLogColRef, { specialistId, serviceId, date });
        flashToast("Logged");
      } catch (e) {
        console.error("Couldn't log service", e);
        flashToast("Couldn't save — check connection");
      }
    });

    const generateBtn = document.getElementById("generate-report-btn");
    if (generateBtn) {
      generateBtn.addEventListener("click", () => {
        const specialistId = document.getElementById("report-specialist").value;
        const orderId = document.getElementById("report-order").value;
        generateReport(specialistId, orderId);
      });
    }

    // Restore any drafts that were open before this refresh (e.g. from editing a log entry)
    Array.from(activeDraftKeys).forEach(key => {
      const [sid, oid] = key.split("::");
      generateReport(sid, oid);
    });
  }

  function getOrCreateDraftContainer(specialistId) {
    const parent = document.getElementById("report-output");
    let el = document.getElementById(`report-draft-${specialistId}`);
    if (!el) {
      el = document.createElement("div");
      el.id = `report-draft-${specialistId}`;
      el.style.marginBottom = "20px";
      parent.appendChild(el);
    }
    return el;
  }

  async function generateReport(specialistId, orderId) {
    activeDraftKeys.add(`${specialistId}::${orderId}`);
    const outputEl = getOrCreateDraftContainer(specialistId);
    outputEl.innerHTML = `<div class="status-line">Generating report…</div>`;

    try {
      const recipeSnap = await getDoc(recipesDocRef);
      recipes = recipeSnap.exists() ? recipeSnap.data() : {};
    } catch (e) { console.error(e); }

    const orderIndex = allOrdersCache.findIndex(o => o.id === orderId);
    const selectedOrder = allOrdersCache[orderIndex];
    const orderTotal = selectedOrder?.total || 0;

    let orderReceipts = [];
    try {
      const receiptSnap = await getDocs(receiptsColRef);
      receiptSnap.forEach(rDoc => {
        const r = rDoc.data();
        if (r.orderId === orderId) orderReceipts.push(r);
      });
    } catch (e) { console.error("Couldn't load receipts for report", e); }

    const periodEnd = selectedOrder?.orderedAt?.toDate ? selectedOrder.orderedAt.toDate() : new Date();
    const periodStart = orderIndex > 0 && allOrdersCache[orderIndex - 1].orderedAt?.toDate
      ? allOrdersCache[orderIndex - 1].orderedAt.toDate()
      : null;
    const periodLabel = periodStart
      ? `${periodStart.toLocaleDateString()} – ${periodEnd.toLocaleDateString()} (Order #${orderIndex + 1})`
      : `through ${periodEnd.toLocaleDateString()} (Order #${orderIndex + 1}, earliest on record)`;

    let allLogs = [];
    try {
      const logSnap = await getDocs(serviceLogColRef);
      logSnap.forEach(d => allLogs.push(d.data()));
    } catch (e) { console.error(e); }

    const inPeriod = allLogs.filter(l => {
      const d = new Date(l.date);
      return (!periodStart || d >= periodStart) && d <= periodEnd;
    });

    const bySpecialist = {};
    SPECIALISTS.forEach(s => bySpecialist[s.id] = {});
    inPeriod.forEach(l => {
      if (!bySpecialist[l.specialistId]) bySpecialist[l.specialistId] = {};
      bySpecialist[l.specialistId][l.serviceId] = (bySpecialist[l.specialistId][l.serviceId] || 0) + 1;
    });

    const specialist = SPECIALISTS.find(s => s.id === specialistId);
    const specialistCounts = bySpecialist[specialistId] || {};
    const specialistTotals = consumableTotal(specialistCounts);
    const specialistWax = (specialistTotals.hardWax || 0) + (specialistTotals.softWax || 0);

    let everyoneWax = 0;
    SPECIALISTS.forEach(s => {
      const t = consumableTotal(bySpecialist[s.id] || {});
      everyoneWax += (t.hardWax || 0) + (t.softWax || 0);
    });
    const pct = everyoneWax > 0 ? Math.round((specialistWax / everyoneWax) * 100) : 0;
    const charge = everyoneWax > 0 ? (specialistWax / everyoneWax) * orderTotal : 0;

    const servicesPerformed = Object.entries(specialistCounts);
    const totalServices = servicesPerformed.reduce((sum, [, c]) => sum + c, 0);

    if (totalServices === 0) {
      outputEl.innerHTML = `<div class="empty-box">
        <div class="empty-title">No logged services for ${specialist.name}</div>
        <div class="empty-sub">Nothing recorded for this order's period yet. Log services above, or ask Claude to sync from her calendar.</div>
      </div>`;
      return;
    }

    const pieDeg = Math.round(pct * 3.6);
    let html = `<div style="background:white;border:2px dashed var(--error);border-radius:12px;padding:20px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <div style="flex:1;text-align:center;background:var(--error);color:white;border-radius:6px;padding:5px;font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">Draft — not saved or visible to ${specialist.name} yet</div>
        <button id="discard-draft-${specialistId}" style="background:transparent;color:var(--error);border:1px solid var(--error);border-radius:6px;font-size:10.5px;padding:5px 8px;cursor:pointer;white-space:nowrap;">Discard</button>
      </div>
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--bark);">${specialist.name}'s Consumption Report</div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-top:4px;">Period: ${periodLabel}</div>
      </div>
      <div style="text-align:center;background:linear-gradient(135deg, var(--bark), #241a12);color:var(--cream);border-radius:12px;padding:16px;margin-bottom:18px;">
        <div style="font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light);opacity:0.85;">Share of Order #${orderIndex + 1}'s Cost</div>
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:38px;margin:4px 0 2px;">$${charge.toFixed(2)}</div>
        <div style="font-size:11px;opacity:0.65;">${pct}% of $${orderTotal.toFixed(2)} total</div>
      </div>
      <div style="display:flex;justify-content:center;margin:20px 0;">
        <div style="width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--gold) 0deg ${pieDeg}deg, rgba(44,32,22,0.12) ${pieDeg}deg 360deg);display:flex;align-items:center;justify-content:center;">
          <div style="width:100px;height:100px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--bark);">${pct}%</div>
            <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.6;">of wax used</div>
          </div>
        </div>
      </div>
      <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;">
        <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">Services performed (${totalServices} total)</div>
        ${servicesPerformed.map(([sid, count]) => {
          const s = SERVICES.find(x => x.id === sid);
          return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span>${s ? s.name : sid}</span><span style="opacity:0.7;">× ${count}</span></div>`;
        }).join("")}
      </div>
      <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;margin-top:14px;">
        <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">Estimated consumption</div>
        ${RECIPE_FIELDS.filter(f => specialistTotals[f.key] > 0).map(f =>
          `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span>${f.label}</span><span style="opacity:0.7;">${specialistTotals[f.key].toFixed(1)}</span></div>`
        ).join("")}
      </div>
      ${(() => {
        const receiptUrls = orderReceipts.map(r => r.imageData);
        if (receiptUrls.length === 0) return "";
        return `<div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;margin-top:14px;">
          <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">Order #${orderIndex + 1} Receipts</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${receiptUrls.map(url => `<img src="${url}" class="receipt-thumb" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gold-light);display:block;cursor:pointer;" />`).join("")}
          </div>
        </div>`;
      })()}
      <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;margin-top:14px;">
        <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">These conclusions were based on the following data</div>
        <div style="font-size:11px;opacity:0.7;line-height:1.6;">
          Billed against: Order #${orderIndex + 1}, placed ${periodEnd.toLocaleDateString()}, total $${orderTotal.toFixed(2)}.<br/>
          Period covered: ${periodLabel}.<br/>
          Recipe values used (live from the Recipes tab at the time this report was generated):
          ${servicesPerformed.map(([sid]) => {
            const s = SERVICES.find(x => x.id === sid);
            const r = recipes[sid] || {};
            const parts = RECIPE_FIELDS.filter(f => r[f.key]).map(f => `${f.label.toLowerCase()}: ${r[f.key]}`).join(", ");
            return `<br/>— ${s ? s.name : sid}: ${parts || "no recipe set"}`;
          }).join("")}
          <br/><br/>
          Total wax used across all specialists in this period: ${everyoneWax.toFixed(1)}g. ${specialist.name}'s share: ${specialistWax.toFixed(1)}g (${pct}%).<br/>
          Charge = ${pct}% × $${orderTotal.toFixed(2)} = <b>$${charge.toFixed(2)}</b>.
        </div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <button class="btn" id="save-report-btn">Save & finalize this report</button>
        <div style="font-size:10px;opacity:0.55;margin-top:6px;">Locks this exact snapshot for ${specialist.name} to see in her own report view.</div>
      </div>
    </div>`;
    outputEl.innerHTML = html;

    const discardBtn = document.getElementById(`discard-draft-${specialistId}`);
    if (discardBtn) {
      discardBtn.addEventListener("click", () => {
        activeDraftKeys.delete(`${specialistId}::${orderId}`);
        outputEl.remove();
      });
    }

    document.getElementById("save-report-btn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "Saving…";
      try {
        await addDoc(savedReportsColRef, {
          specialistId,
          specialistName: specialist.name,
          orderIndex,
          orderId,
          orderTotal,
          periodLabel,
          pct,
          charge,
          servicesPerformed,
          specialistTotals,
          everyoneWax,
          specialistWax,
          receiptUrls: orderReceipts.map(r => r.imageData),
          recipeSnapshot: Object.fromEntries(servicesPerformed.map(([sid]) => [sid, recipes[sid] || {}])),
          savedAt: serverTimestamp(),
        });
        flashToast(`Saved — ${specialist.name} can now see this in her report view`);
        e.target.textContent = "Saved ✓";
        activeDraftKeys.delete(`${specialistId}::${orderId}`);
        const draftBadge = e.target.closest('div[style*="dashed"]');
        if (draftBadge) {
          draftBadge.style.border = "1px solid var(--gold)";
          const badgeLabel = draftBadge.querySelector('div[style*="background:var(--error)"]');
          if (badgeLabel) {
            badgeLabel.style.background = "var(--gold)";
            badgeLabel.textContent = `Saved — visible to ${specialist.name} now`;
          }
        }
      } catch (err) {
        console.error("Couldn't save report", err);
        flashToast("Couldn't save — check connection");
        e.target.disabled = false;
        e.target.textContent = "Save & finalize this report";
      }
    });
  }

  let myUnlockedSpecialistId = null;

          <div class="empty-title">No saved reports yet</div>

          </div>
          <div style="border-top:1px solid rgba(44,32,22,0.1);padding-top:14px;margin-top:14px;">

            ${RECIPE_FIELDS.filter(f => (r.specialistTotals || {})[f.key] > 0).map(f =>
              `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span>${f.label}</span><span style="opacity:0.7;">${r.specialistTotals[f.key].toFixed(1)}</span></div>`
            ).join("")}
          </div>
          ${(r.receiptUrls || []).length > 0 ? `

              <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:8px;">Receipts</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${r.receiptUrls.map(url => `<img src="${url}" class="receipt-thumb" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gold-light);display:block;cursor:pointer;" />`).join("")}

  function switchView(v) {
    view = v;
    hasNavigated = true;
    document.getElementById("tab-team").classList.toggle("active", v === "team");
    document.getElementById("tab-owner").classList.toggle("active", v === "owner");
    document.getElementById("tab-history").classList.toggle("active", v === "history");
    document.getElementById("tab-recipes").classList.toggle("active", v === "recipes");
    document.getElementById("tab-reports").classList.toggle("active", v === "reports");
    document.getElementById("tab-myreport").classList.toggle("active", v === "myreport");
    teamViewEl.classList.toggle("hidden", v !== "team");
    document.getElementById("history-view").classList.toggle("hidden", v !== "history");
    document.getElementById("recipes-view").classList.toggle("hidden", v !== "recipes");
    document.getElementById("reports-view").classList.toggle("hidden", v !== "reports" || !(unlocked || SKIP_PASSCODE));
    document.getElementById("myreport-view").classList.toggle("hidden", v !== "myreport" || !myUnlockedSpecialistId);
    document.getElementById("myreport-lock").classList.toggle("hidden", v !== "myreport" || !!myUnlockedSpecialistId);

    if (v === "history") {
      ownerLockEl.classList.add("hidden");
      ownerViewEl.classList.add("hidden");
      renderHistory();
    } else if (v === "team") {
      unlocked = SKIP_PASSCODE;
      myUnlockedSpecialistId = null;
      recipesEditUnlocked = false;
      ownerLockEl.classList.add("hidden");
      ownerViewEl.classList.add("hidden");
    } else if (v === "recipes") {
      ownerViewEl.classList.add("hidden");
      ownerLockEl.classList.add("hidden");
      renderRecipes();
    } else if (v === "reports") {
      ownerViewEl.classList.add("hidden");
      if (unlocked || SKIP_PASSCODE) {
        ownerLockEl.classList.add("hidden");
        renderReports();
      } else {
        ownerLockEl.classList.remove("hidden");
      }
    } else if (v === "myreport") {
      ownerViewEl.classList.add("hidden");
      if (myUnlockedSpecialistId) {
        renderMyReports();
      }
    } else {
      ownerViewEl.classList.toggle("hidden", !(unlocked || SKIP_PASSCODE));
      if (unlocked || SKIP_PASSCODE) {
        ownerLockEl.classList.add("hidden");
        renderOwner();
      } else {
        ownerLockEl.classList.remove("hidden");
      }
    }

    document.querySelector(".wrap").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("tab-reports").addEventListener("click", () => switchView("reports"));
  document.getElementById("tab-myreport").addEventListener("click", () => switchView("myreport"));
  document.getElementById("tab-recipes").addEventListener("click", () => switchView("recipes"));
  document.getElementById("tab-team").addEventListener("click", () => switchView("team"));
  document.getElementById("tab-owner").addEventListener("click", () => switchView("owner"));
  document.getElementById("tab-history").addEventListener("click", () => switchView("history"));
  document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
  document.getElementById("myreport-unlock-btn").addEventListener("click", tryMyReportUnlock);
  document.getElementById("myreport-passcode-input").addEventListener("keydown", e => { if (e.key === "Enter") tryMyReportUnlock(); });

  function tryMyReportUnlock() {
    const input = document.getElementById("myreport-passcode-input");
    const errorEl = document.getElementById("myreport-passcode-error");
    const match = Object.entries(SPECIALIST_PASSCODES).find(([id, code]) => code === input.value);
    if (match) {
      myUnlockedSpecialistId = match[0];
      input.value = "";
      errorEl.classList.add("hidden");
      document.getElementById("myreport-lock").classList.add("hidden");
      document.getElementById("myreport-view").classList.remove("hidden");
      renderMyReports();
    } else {
      errorEl.classList.remove("hidden");
      input.classList.add("error");
    }
  }
  document.getElementById("passcode-input").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

  function tryUnlock() {
    const input = document.getElementById("passcode-input");
    const errorEl = document.getElementById("passcode-error");
    if (input.value === OWNER_PASSCODE) {
      unlocked = true;
      input.value = "";
      errorEl.classList.add("hidden");
      ownerLockEl.classList.add("hidden");
      if (view === "recipes") {
        document.getElementById("recipes-view").classList.remove("hidden");
        renderRecipes();
      } else if (view === "reports") {
        document.getElementById("reports-view").classList.remove("hidden");
        renderReports();
      } else {
        ownerViewEl.classList.remove("hidden");
        renderOwner();
      }
    } else {
      errorEl.classList.remove("hidden");
      input.classList.add("error");
    }
  }

  // Real-time listener — every device sees changes instantly
  onSnapshot(stateDocRef, (snap) => {
    loadingEl.classList.add("hidden");
    if (snap.exists()) {
      const data = snap.data();
      state = { ...defaultState(), ...state, ...data };
    } else {
      // First run ever — seed the document
      setDoc(stateDocRef, defaultState()).catch(e => console.error(e));
    }
    renderTeam();
    if (view === "owner" && (unlocked || SKIP_PASSCODE)) renderOwner();
  }, (err) => {
    console.error("Listener error", err);
    loadingEl.textContent = "Couldn't connect — check Firestore rules.";
    loadingEl.classList.remove("hidden");
  });
</script>
</body>
</html>
